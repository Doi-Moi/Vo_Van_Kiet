  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      },
    );

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

 đất của Tây, của Việt gian cho dân nghèo Xin giữ lại một số cán bộ cốt cán Về Nam, việc đầu tiên của ông Ba là cho triển khai việc chia ruộng đất và chọn cốt cán ở lại thành bộ khung từ Xứ xuố&quot;,&quot;pages&quot;:[155]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Đừng để kẻ thù có cơ hội tung tin ta phá hoại Hiệp định Hàng chục khẩu súng được bôi mỡ, bỏ trong những chiếc thùng phi và hàn kín, chôn xuống những cánh rừng theo những sơ đồ cụ thể, chỉ có Võ Văn Kiệt và vài người biết Ngoài vũ khí, ông Ba Duẩn còn giao cho Võ Văn Kiệt phụ trách một số cán bộ võ trang&quot;,&quot;pages&quot;:[156]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Tấm ảnh của Lê Duẩn do Trần Bạch Đằng chụp đã buộc ông phải rời một cơ sở mà Võ Văn Kiệt cho là lý tưởng&quot;,&quot;pages&quot;:[168]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Điều đó trước tiên phải nói đến vai trò của dân mình, sau là tinh thần cảnh giác của chính Lê Duẩn Võ Văn Kiệt đã đi cùng Lê Duẩn từ đó&quot;,&quot;pages&quot;:[171]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Võ Văn Kiệt cho rằng cuộc cách mạng Việt Nam thành công có phần đóng góp rất to lớn của trí thức Nam Bộ Một lần nữa, Lê Duẩn lại thể hiện sự sắc sảo của một nhà lãnh đạo từng lăn lộn ở đất Nam Kỳ&quot;,&quot;pages&quot;:[286]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Ông muốn Bộ Chính trị, Bộ Quốc phòng phải được nghe tất cả báo cáo của các quân khu Những năm tháng thoái trào sau ngày ký Hiệp định Genève, Lê Duẩn đã có dịp sống với Võ Văn Kiệt&quot;,&quot;pages&quot;:[433]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Ông hiểu con người này luôn lấy thực tiễn làm thước đo cho nghị quyết Còn ấn tượng đầu tiên của Sáu Dân đối với Lê Duẩn là cách giải quyết các vấn đề đặt ra trong một báo cáo về tình hình miền Tây thời chống Pháp&quot;,&quot;pages&quot;:[433]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Nhưng sau khi nghe toàn bộ sự việc thì Lê Duẩn lại rất hài lòng về cách cư xử nghĩa hiệp mang cốt cách Nam Bộ của Sáu Dân&quot;,&quot;pages&quot;:[434]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Nam Bộ có nhiều đồn điền như đồn điền Cờ Đỏ được xây dựng từ thời Pháp, chắc chắn đủ đất cho ông dụng võ Cả hai lại cười, tiếng cười hào sảng như nhau Trở về, Võ Văn Kiệt nhận được điện của Văn phòng Trung ương mời vào gặp Lê Duẩn Khi ngồi lên xe, Võ Văn Kiệt nghĩ: \&quot;Chắc ông Ba lại định cho miền Tây gì nữa đây&quot;,&quot;pages&quot;:[442]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Một người như Lê Duẩn cũng không dễ vượt nổi cái ngưỡng tiêu chuẩn về nhân sự, đó có thể là chỗ mạnh và cũng là chỗ yếu của cơ chế tổ chức của ta Vậy là Võ Văn Kiệt lại có thêm một người đồng hành về lại miền Tây Chuyến đó, ông trở về bằng tàu hai đáy chở khẳm súng đạn của Hùng Lùn - người cận vệ năm xưa của Lê Duẩn&quot;,&quot;pages&quot;:[443]}]},{&quot;id&quot;:&quot;e0012&quot;,&quot;source&quot;:&quot;p0070&quot;,&quot;target&quot;:&quot;vvk&quot;,&quot;source_name&quot;:&quot;Huỳnh Tấn Phát&quot;,&quot;target_name&quot;:&quot;Võ Văn Kiệt&quot;,&quot;types&quot;:[&quot;chỉ huy/công tác&quot;,&quot;gặp gỡ/trao đổi&quot;],&quot;strength&quot;:4.73,&quot;interaction_count&quot;:19,&quot;pages&quot;:[251,252,255,256,257,258,259,260,261,263,345,346],&quot;events&quot;:[{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;11 Trưởng ban Trí vận Khu ủy Sài Gòn - Gia Định được Võ Văn Kiệt nể vì nhất là Kiến trúc sư Huỳnh Tấn Phát&quot;,&quot;pages&quot;:[251]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Ảnh đang chờ ông Chín Đang ngồi võng, Võ Văn Kiệt đứng bật dậy, đưa tay đẩy chiếc kính lên Huỳnh Tấn Phát bước vào, nở nụ cười và giơ bàn tay ra nắm chặt tay Võ Văn Kiệt 1&quot;,&quot;pages&quot;:[251]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Tôi chỉ việc đi theo Huỳnh Tấn Phát nói Tôi nhận chức Bí thư Thành ủy Sài Gòn - Chợ Lớn với một giao liên là bà Năm đó - Võ Văn Kiệt nói - Nhờ bà mà Khu ủy Sài Gòn - Gia Định được như bây giờ Dừng lại, Võ Văn Kiệt nhìn kỹ người trí thức đang đứng trước ông một thoáng rồi tiếp Tôi nghe tên ông đã lâu, giờ mới gặp&quot;,&quot;pages&quot;:[252]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Ở \&quot;vườn\&quot; có 2 cái ghế gỗ thô, do anh em cảnh vệ tự đóng Huỳnh Tấn Phát ngồi xuống ghế, nhìn Võ Văn Kiệt nói Tôi nghe người ta đồn ông cứng đầu lắm&quot;,&quot;pages&quot;:[252]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Nhưng đi sâu vô dân chúng thì lại thấy, không phải ai cũng đồng tình với chế độ Ngô Đình Diệm đâu Võ Văn Kiệt nối lời Huỳnh Tấn Phát Tôi cảm giác ngọn lửa vẫn âm ỉ trong giới trí thức, nhân sĩ, sinh viên thanh niên, học sinh&quot;,&quot;pages&quot;:[252]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Nói thiệt, tôi rất sợ, lúc nào đó do vận dụng máy móc, mình làm ổng giận thì đó là một thiệt thòi rất lớn cho cách mạng Võ Văn Kiệt dừng lại, ông đưa bao thuốc cotab mời Huỳnh Tấn Phát rồi rút một điếu châm lửa, rít một hơi thật sâu&quot;,&quot;pages&quot;:[255]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Bí quá chúng tôi buộc phải đi xin, đi mượn và móc lớp trẻ ra đào tạo cơ bản từ đầu Huỳnh Tấn Phát lắc đầu cười Võ Văn Kiệt nói tiếp Chắc ông cười tôi làm tướng không quân chớ gì?&quot;,&quot;pages&quot;:[256]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Không hiểu sao ông lại nghĩ nhiều về cuộc gặp giữa ông và Võ Văn Kiệt, một cuộc gặp ấn tượng bởi một cái tâm rất sáng, một cái tầm rất rộng của một con người từ bùn lầy chân đất mà lên Huỳnh Tấn Phát cảm giác trong lối suy nghĩ của Võ Văn Kiệt có cái gì đó khác với lối suy nghĩ thông thường&quot;,&quot;pages&quot;:[257]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;VÕ VĂN KIỆT - Trí tuệ và sáng tạo Huỳnh Tấn Phát đã từng gặp rất nhiều trí thức tên tuổi, nhiều nhà nho cấp tiến, nhiều nhà lãnh đạo cách mạng, nhưng quả thật chưa bao giờ ông gặp được một nhân vật như Võ Văn Kiệt Có lẽ đó là nguyên nhân sâu xa khiến Võ Văn Kiệt cảm thấy \&quot;không vô\&quot; với chỉnh huấn Hoa Nam, với cải cách ruộng đất, với việc quy kết thành phần, &quot;,&quot;pages&quot;:[258]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Từ thực tiễn, Võ Văn Kiệt soi vào những lý luận đã học và ông đã phủ định chính những bài học mà ông được nghe được học Được làm việc dưới sự lãnh đạo của một bí thư như vậy, Huỳnh Tấn Phát thấy mừng lắm Sáng hôm sau, khi Võ Văn Kiệt hỏi thăm về giới trí thức Sài Gòn Huỳnh Tấn Phát phấn chấn khác thường Tốt lắm, kiên trung lắm - Huỳnh Tấn Phát nói - Bọn địch&quot;,&quot;pages&quot;:[258]}]},{&quot;id&quot;:&quot;e0013&quot;,&quot;source&quot;:&quot;p0191&quot;,&quot;target&quot;:&quot;vvk&quot;,&quot;source_name&quot;:&quot;Phạm Hùng&quot;,&quot;target_name&quot;:&quot;Võ Văn Kiệt&quot;,&quot;types&quot;:[&quot;cùng tham gia sự kiện&quot;,&quot;gặp gỡ/trao đổi&quot;,&quot;chỉ huy/công tác&quot;,&quot;đối đầu/đối thủ&quot;],&quot;strength&quot;:4.68,&quot;interaction_count&quot;:16,&quot;pages&quot;:[134,137,159,340,343,358,362,499,500,501,549],&quot;events&quot;:[{&quot;period&quot;:&quot;1975&quot;,&quot;event&quot;:&quot;Năm 1975, Võ Văn Kiệt cùng ông Phạm Hùng đã ra Hà Nội xin phép Trung ương rước anh chị Ung Văn Khiêm về tại ngôi nhà ở đường Phan Thanh Giản (nay là đường Điện Biên Phủ&quot;,&quot;pages&quot;:[137]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Chương I TỪ CUỘC KHỞI NGHĨA NAM KỲ ĐẾN NGÀY KÝ HIỆP ĐỊNH GENÈVE VỀ VIỆT NAM Lặng lẽ, Võ Văn Kiệt chia tay Phạm Hùng, Ung Văn Khiêm, Lê Đức Thọ&quot;,&quot;pages&quot;:[159]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Từ nội đô trở về, Võ Văn Kiệt lên ngay căn cứ R báo cáo với hai ông Phạm Hùng và Nguyễn Văn Linh¹ Theo những gì mà tôi tìm hiểu được thì dân chúng, đặc biệt là dân nghèo, vẫn rất tốt&quot;,&quot;pages&quot;:[340]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Phạm Hùng cắt lời Võ Văn Kiệt Đó là nguyên tắc bất di bất dịch của bất kỳ cuộc tổng công kích, tổng khởi nghĩa nào Nguyễn Văn Linh có phần ưu tư&quot;,&quot;pages&quot;:[340]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Những cán bộ dày dạn kinh nghiệm hoạt động cách mạng ở nội thành ấy không ngờ lại ngã xuống trong Mậu Thân Võ Văn Kiệt quyết định viết thư cho Phạm Hùng Theo giải thích của Bộ Chính trị thì “Mậu Thân là một quá trình&quot;,&quot;pages&quot;:[358]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;25 Võ Văn Kiệt hoàn toàn không ngờ, Phạm Hùng - Bí thư Trung ương Cục lại ký quyết định điều ông về làm Bí thư Khu ủy miền Tây&quot;,&quot;pages&quot;:[362]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Nhưng không thấy ai bị mất chức Đấy có lẽ là vụ \&quot;xé rào\&quot; đầu tiên ở đồng bằng sông Cửu Long, mà người khơi gợi là Võ Văn Kiệt Khi làm việc với Phạm Hùng, có những lúc, Võ Văn Kiệt thấy không đồng tình&quot;,&quot;pages&quot;:[500]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Võ Văn Kiệt đã từng viết về Phạm Hùng như sau: Ở ông Hai có một tấm lòng nhân ái sâu sắc và cuộc sống tình cảm chân thành, được mọi người tin yêu, quý mến&quot;,&quot;pages&quot;:[500]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Đối với các đồng chí trong Trung ương Đảng và Chính phủ cũng như đội ngũ lãnh đạo các địa phương và các giới, ông đều có mối quan hệ gắn bó, thân tình, trân trọng lắng nghe ý kiến của người đối thoại với một thái độ cởi mở Cũng như Phạm Hùng, Võ Văn Kiệt tham gia hoạt động cách mạng từ tuổi 16&quot;,&quot;pages&quot;:[500]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Nhiều lúc, ông lao vào chịu đòn thay cho Bác Tôn, cho Lê Duẩn Một lần, Phạm Hùng mời Võ Văn Kiệt về nhà dùng bữa&quot;,&quot;pages&quot;:[500]}]},{&quot;id&quot;:&quot;e0014&quot;,&quot;source&quot;:&quot;p0315&quot;,&quot;target&quot;:&quot;vvk&quot;,&quot;source_name&quot;:&quot;Vũ Ngọc Hải&quot;,&quot;target_name&quot;:&quot;Võ Văn Kiệt&quot;,&quot;types&quot;:[&quot;chỉ huy/công tác&quot;,&quot;gặp gỡ/trao đổi&quot;],&quot;strength&quot;:4.68,&quot;interaction_count&quot;:16,&quot;pages&quot;:[578,581,587,594,595,596,597],&quot;events&quot;:[{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Có người nói, điện từ sông Đà tới Đà Nẵng chỉ còn con số không Lật đi lật lại từng phương án với Vũ Ngọc Hải - Bộ trưởng Bộ Năng lượng, các thứ trưởng và chuyên gia ngành điện, Võ Văn Kiệt vẫn thấy độ rủi ro của đường dây tải điện Bắc - Nam là quá lớn&quot;,&quot;pages&quot;:[578]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Nhưng Võ Văn Kiệt, Vũ Ngọc Hải và nhiều chuyên gia, cán bộ, công nhân ngành điện lại tin tưởng&quot;,&quot;pages&quot;:[581]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Tất cả đều hết lòng, đều xả thân như bước vào một trận quyết chiến Võ Văn Kiệt yêu cầu Vũ Ngọc Hải hai vấn đề mà công trình phải bảo đảm: một là chất lượng, hai là tiến độ Bộ trưởng Bộ Năng lượng Vũ Ngọc Hải là cánh tay phải và là cố vấn xuất sắc của Võ Văn Kiệt&quot;,&quot;pages&quot;:[581]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Vấn đề sống còn là vật tư phải bảo đảm cung cấp theo đúng kế hoạch, không được chậm dù là một giờ Đấy cũng là thời gian mà toàn bộ tâm trí của Vũ Ngọc Hải phải tập trung vào những điểm nóng của đường dây tải điện Bắc - Nam: Trạm biến áp Phú Lâm đất không chân đế, Trạm biến áp Pleiku không có đường cho xe đưa nguyên vật liệu lên, chuyên gia không đủ Từ Đà Nẵn&quot;,&quot;pages&quot;:[587]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Trí tuệ và sáng tạo Võ Văn Kiệt nghĩ, một bộ trưởng với hàng núi công việc, việc nào cũng quan trọng nên nhiều khi sẽ không nắm được việc lính của mình lươn lẹo dối trá, lòng vòng để kiếm chác, thu lợi bất chính Nhưng sự thiếu sâu sát, sự cả tin này của Vũ Ngọc Hải may mắn không ảnh hưởng đến chất lượng và tiến độ của đường dây tải điện Bắc - Nam Công lao cầ&quot;,&quot;pages&quot;:[594]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Đấy cũng là truyền thống tôn sư trọng đạo, truyền thống khoan dung từ ngàn đời của cha ông ta Đêm ấy, lại một đêm không ngủ nữa của Võ Văn Kiệt, vui buồn lẫn lộn Ông lại nghĩ về Vũ Ngọc Hải, người xứng đáng được hưởng hạnh phúc niềm vui khi lưới điện quốc gia đã hòa quyện dòng điện của ba miền&quot;,&quot;pages&quot;:[594]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Và Võ Văn Kiệt đã quyết định, một quyết định táo bạo: mang chiếc huy hiệu đường dây 500kV vào trại giam Thanh Xuân trao cho Vũ Ngọc Hải&quot;,&quot;pages&quot;:[594]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Đúng là một quyết định lạ lùng chưa từng có tiền lệ Sáng hôm sau, Võ Văn Kiệt dậy sớm hơn thường lệ và bảo thư ký chuẩn bị cho ông đi thăm Vũ Ngọc Hải&quot;,&quot;pages&quot;:[594]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Võ Văn Kiệt vẫn nắm chặt tay Vũ Ngọc Hải&quot;,&quot;pages&quot;:[595]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Niềm vui bất ngờ và nỗi buồn dai dẳng nhiều tháng qua đã khiến ông bần thần, lúng túng Võ Văn Kiệt nở nụ cười đầy thông cảm và nói Hôm nay, tôi tới đây báo cho ông tin vui này và gắn chiếc huy hiệu đường dây 500kV Bắc - Nam đầu tiên cho ông Ngỡ ngàng, bối rối, nhưng rồi Vũ Ngọc Hải cũng kịp nhận ra mình cần phải làm gì&quot;,&quot;pages&quot;:[595]}]},{&quot;id&quot;:&quot;e0015&quot;,&quot;source&quot;:&quot;p0203&quot;,&quot;target&quot;:&quot;vvk&quot;,&quot;source_name&quot;:&quot;Phạm Văn Đồng&quot;,&quot;target_name&quot;:&quot;Võ Văn Kiệt&quot;,&quot;types&quot;:[&quot;chỉ huy/công tác&quot;,&quot;gặp gỡ/trao đổi&quot;],&quot;strength&quot;:4.61,&quot;interaction_count&quot;:13,&quot;pages&quot;:[478,480,529,531,552,555,582,584],&quot;events&quot;:[{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Nếu trong 3 năm đó Thành phố không đáp ứng được những chỉ tiêu Trung ương đã giao thì tôi xin từ chức và xin ra khỏi Đảng Lê Duẩn ngả lưng ra sau, mỉm cười, nói Tôi tin Sáu Dân làm được, chắc không phải ra khỏi Đảng đâu Lê Duẩn dừng lại như suy nghĩ điều gì, rồi tiếp Nhưng Sáu Dân nên trao đổi thêm ý kiến với ông Tô Gặp Phạm Văn Đồng, Võ Văn Kiệt trình bày c&quot;,&quot;pages&quot;:[478]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Trí tuệ và sáng tạo Tôi nghe nói Võ Văn Kiệt nhìn thẳng Phạm Văn Đồng, vị Thủ tướng mà lâu nay ông rất tôn kính về cuộc sống thanh bạch và trong sáng, về trí tuệ mẫn cán và kiến thức văn hóa uyên thâm&quot;,&quot;pages&quot;:[480]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Ông rất quý Nhạc sĩ Nguyễn Xuân Khoát, ông chơi thân với Giáo sư toán học Hoàng Tụy Chờ cho Phạm Văn Đồng nói hết, Võ Văn Kiệt tiếp lời Tôi luôn ý thức sâu sắc rằng xây một thành phố mới bao giờ cũng đơn giản hơn là cải tạo một thành phố ngổn ngang những cặn bã của xã hội, đặc biệt là cặn bã của Mỹ để lại&quot;,&quot;pages&quot;:[480]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Võ Văn Kiệt cảm thấy như bị dội mấy gáo nước lạnh Phạm Văn Đồng có vẻ phân vân&quot;,&quot;pages&quot;:[529]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Nhưng Phạm Văn Đồng không ngờ Võ Văn Kiệt lại trình bày mọi vấn đề từ tổng quát tới chi tiết như là một chuyên gia hàng đầu về thủy điện&quot;,&quot;pages&quot;:[529]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;THỰC TIỄN VÀ SÁNG TẠO thời chiến, giải quyết tình huống trong chớp mắt là chuyện thường nhật nhưng xây dựng chủ nghĩa xã hội lại đòi hỏi phải có kế hoạch chi tiết, đòi hỏi sự cân bằng ngân sách Sau cùng, ông nói rất thật Cái khó nhất là bên bạn Võ Văn Kiệt suy nghĩ một lúc rồi nói Nếu được sự ủy nhiệm của Thủ tướng¹, tôi xin làm việc này với Ủy ban Kế hoạch &quot;,&quot;pages&quot;:[531]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Ông gật đầu miễn cưỡng và không hy vọng nhiều về khả năng đàm phán của Võ Văn Kiệt Phạm Văn Đồng một lần nữa lại bất ngờ vì Võ Văn Kiệt đã thành công Phó Chủ tịch Hội đồng Bộ trưởng Liên Xô Baibakov đã tiếp Võ Văn Kiệt chân tình, cởi mở và thẳng thắn&quot;,&quot;pages&quot;:[531]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;11 Tối hôm sau, Võ Văn Kiệt đến thăm Phạm Văn Đồng, đúng hơn là ông đến theo yêu cầu của vị Chủ tịch Hội đồng Bộ trưởng&quot;,&quot;pages&quot;:[552]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Hơn 3 tháng sau, chính Lê Duẩn lại gọi ông tới và giải tỏa Cũng như Lê Đức Thọ, Phạm Văn Đồng ra tận cửa bắt tay Võ Văn Kiệt và khoác vai đưa vị phó của mình tới xalông&quot;,&quot;pages&quot;:[552]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Một lần nữa, Võ Văn Kiệt lại thấy ở ông phong cách một học giả hơn là một nhà chính trị Sau chén trà, Phạm Văn Đồng hỏi Võ Văn Kiệt về tình hình Thành phố Hồ Chí Minh Tôi nghe ông Ba Duẩn khen Thành phố Hồ Chí Minh năng động dám nghĩ, dám làm&quot;,&quot;pages&quot;:[552]}]},{&quot;id&quot;:&quot;e0016&quot;,&quot;source&quot;:&quot;p0122&quot;,&quot;target&quot;:&quot;p0174&quot;,&quot;source_name&quot;:&quot;Ngô Thị Huệ&quot;,&quot;target_name&quot;:&quot;Nguyễn Văn Linh&quot;,&quot;types&quot;:[&quot;gia đình&quot;],&quot;strength&quot;:4.6,&quot;interaction_count&quot;:1,&quot;pages&quot;:[339],&quot;events&quot;:[{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Hiếu Dân ra Hà Nội năm lên 9 tuổi, ở nhà bà Ngô Thị Huệ - nguyên Phó Bí thư Tỉnh ủy Vĩnh Long, vợ đồng chí Nguyễn Văn Linh&quot;,&quot;pages&quot;:[339]}]},{&quot;id&quot;:&quot;e0017&quot;,&quot;source&quot;:&quot;p0169&quot;,&quot;target&quot;:&quot;p0187&quot;,&quot;source_name&quot;:&quot;Nguyễn Văn Hảo&quot;,&quot;target_name&quot;:&quot;Nguyễn Xuân Oánh&quot;,&quot;types&quot;:[&quot;thầy–trò/cố vấn&quot;,&quot;đồng chí/cộng tác&quot;],&quot;strength&quot;:4.57,&quot;interaction_count&quot;:6,&quot;pages&quot;:[470,521,523,543,658,659],&quot;events&quot;:[{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Nhưng ai cũng lắc đầu, mặc dù họ rất kính nể ông Nguyễn Xuân Oánh điềm đạm trả lời Muốn phát triển kinh tế phải mở rộng nền kinh tế thị trường Tiến sĩ Nguyễn Văn Hảo chồm dậy, giọng sang sảng Các ông cộng sản làm sao dung nạp được chén thuốc đắng đó Tiến sĩ Nguyễn Văn Hảo nói tiếp Hồi ở Mỹ, tôi có đọc chính sách kinh tế mới (NEP) của Lênin&quot;,&quot;pages&quot;:[470]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Ông im lặng, nhưng trong đầu đã hiện ra những ý tưởng mới Sau Nguyễn Xuân Oánh, Võ Văn Kiệt tiếp cận với Nguyễn Văn Hảo Tiến sĩ Kinh tế học từng học ở Mỹ&quot;,&quot;pages&quot;:[521]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Cả hai cùng cười, hai nụ cười đều hồn nhiên, vô tư, đều chân tình và thấu hiểu Cả tiến sĩ Nguyễn Xuân Oánh và tiến sĩ Nguyễn Văn Hảo đều là những nhà kinh tế lớn, có uy tín và độ tin cậy đối với các nước tư bản cũng như các cơ quan tài chính quốc tế&quot;,&quot;pages&quot;:[523]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Tôi sẽ trở về khi đất nước cởi mở hơn Nguyễn Văn Hảo, Nguyễn Xuân Oánh là những nhà kinh tế lớn, không chỉ ở Việt Nam mà mang tầm cỡ thế giới&quot;,&quot;pages&quot;:[543]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Nhưng phải nói, chính nhờ những tài liệu kinh tế của Nguyễn Văn Hảo, Nguyễn Xuân Oánh mà từ ngày đổi mới, Võ Văn Kiệt đã lãnh đạo Chính phủ đi vào kinh tế thị trường không bị hẫng hụt, đúng hơn là chủ động và có phần sáng tạo theo hoàn cảnh, điều kiện của Việt Nam Đường hướng của Đại hội Đảng lần thứ VI là vậy, nhưng trong thực tế mới cũ đan xen, tâm lý ngại&quot;,&quot;pages&quot;:[658]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Những tên tuổi lớn như Ngô Viết Thụ, Phạm Biểu Tâm, Phạm Hoàng Hộ, Chu Phạm Ngọc Sơn, Trần Ngọc Liễng, Ngô Bá Thành, Nguyễn Xuân Oánh, Nguyễn Văn Hảo; các nhân sĩ, nghệ sĩ lớn như Phùng Há, Kim Cương, Thanh Nga, Bạch Tuyết Thành Được đã gắn bó trong Hội Trí thức có trụ sở ở 43 Nguyễn Thông Ở miền Bắc khó khăn hơn&quot;,&quot;pages&quot;:[659]}]},{&quot;id&quot;:&quot;e0018&quot;,&quot;source&quot;:&quot;p0042&quot;,&quot;target&quot;:&quot;p0079&quot;,&quot;source_name&quot;:&quot;Hồ Chí Minh&quot;,&quot;target_name&quot;:&quot;Lê Duẩn&quot;,&quot;types&quot;:[&quot;chỉ huy/công tác&quot;,&quot;gặp gỡ/trao đổi&quot;,&quot;đồng chí/cộng tác&quot;,&quot;cùng tham gia sự kiện&quot;],&quot;strength&quot;:4.56,&quot;interaction_count&quot;:11,&quot;pages&quot;:[170,191,192,288,464,466,467,473,525,552,556],&quot;events&quot;:[{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Và chính Bác Hồ đã cử Lê Duẩn ở lại&quot;,&quot;pages&quot;:[170]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Cuộc hội nghị lịch sử này được tổ chức ở nhà Lê Duẩn, số 6 đường Hoàng Diệu, Hà Nội, do Bác Hồ chủ trì&quot;,&quot;pages&quot;:[191]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Trước khi trở về, Lê Duẩn đã tổ chức cho hai ông gặp Bác Hồ Lê Duẩn dặn Trước khi vào lại miền Nam, hai ông nên đến chào Bác Ông dừng lại như đắn đo điều gì, rồi tiếp Nếu Bác hỏi gì thì nói nấy&quot;,&quot;pages&quot;:[192]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Thực tế diễn ra trên chiến trường miền Nam đã cho thấy Bác Hồ Lê Duẩn, Võ Nguyên Giáp, Nguyễn Chí Thanh đã thuộc nằm lòng Binh thư yếu lược Đấy là những nhà chính trị và những nhà quân sự tài năng của Việt Nam ở thế kỷ XX&quot;,&quot;pages&quot;:[288]},{&quot;period&quot;:&quot;30/4/1975&quot;,&quot;event&quot;:&quot;Lòng người còn trong men say ngày chiến thắng khi đã giành lại được non sông gấm vóc của tổ tiên để lại Sau ngày 30/4/1975, Lê Duẩn vào Thành phố Hồ Chí Minh&quot;,&quot;pages&quot;:[464]},{&quot;period&quot;:&quot;năm 1955 - 1956&quot;,&quot;event&quot;:&quot;Và đó cũng là lý do ông cảm nhận rõ tư tưởng Cụ Hồ: “Các dân tộc Viễn Đông có trải qua hai giai đoạn đấu không?”¹ Những năm 1955 - 1956 là thời kỳ gay go nhất của cuộc cách mạng ở miền Nam Việt Nam, Lê Duẩn vẫn sống, hoạt động được từ nội thành Sài Gòn cho tới các vùng địch đánh phá, kiểm soát gắt gao nhất chính là nhờ dân&quot;,&quot;pages&quot;:[466]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Chính lòng yêu nước ấy và chính sách đại đoàn kết của Bác Hồ đã giúp cho thế hệ học trò của Bác giành lại được giang sơn gấm vóc Việt Nam Hoạt động giữa lòng địch từ trước khởi nghĩa Nam Kỳ qua chống Pháp, đến chống Mỹ, Võ Văn Kiệt hiểu sâu sắc câu nói của Lê Duẩn&quot;,&quot;pages&quot;:[467]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Ông thường nhắc lại lời của Mác với những nhà nghiên cứu kinh điển rằng: “Sự phát triển tự do của mỗi người là điều kiện cho sự phát triển tự do của tất cả mọi người”² Lê Duẩn không phải là n ,259,439,466],&quot;events&quot;:[{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Từ Hoàng Quốc Tân, Võ Văn Kiệt lại nghĩ tới tầng lớp trí thức Nam Bộ, từ Luật sư Phạm Văn Bạch, Phạm Ngọc Thảo, Phạm Ngọc Thuần đến&quot;,&quot;pages&quot;:[258]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Từ bên Nga, các đồng chí Quốc tế Cộng sản làm sao hiểu hết được hoàn cảnh Việt Nam, hiểu được lòng yêu nước thương dân của một tầng lớp trí thức vốn là con những gia đình giàu có và hầu hết là dân Tây học lại có thể bỏ lại tất cả sau lưng, lớp ra bưng biền tham gia cuộc chiến chống Pháp rồi chống Mỹ như Phạm Văn Bạch, Phạm Ngọc Thuần, Nguyễn Thành Vĩnh..., l&quot;,&quot;pages&quot;:[259]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Ngày nay, nhờ đại đoàn kết mà chúng ta tập hợp được sức mạnh của cả dân tộc, từ người nông dân đầu trần chân đất như ông, cho tới các đại trí thức, đại điền chủ như Phạm Văn Bạch, Phạm Ngọc Thuần, Phạm Ngọc Thảo, Phạm Ngọc Thạch, Cao Triều Phát, Nguyễn Văn Hưởng, Nguyễn Hữu Thọ&quot;,&quot;pages&quot;:[439]},{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Khi Phạm Văn Bạch ra Bắc, mọi công việc dồn lên vai Phạm Ngọc Thuần&quot;,&quot;pages&quot;:[466]}]},{&quot;id&quot;:&quot;e0037&quot;,&quot;source&quot;:&quot;p0295&quot;,&quot;target&quot;:&quot;vvk&quot;,&quot;source_name&quot;:&quot;Trường Chinh&quot;,&quot;target_name&quot;:&quot;Võ Văn Kiệt&quot;,&quot;types&quot;:[&quot;chỉ huy/công tác&quot;],&quot;strength&quot;:4.24,&quot;interaction_count&quot;:4,&quot;pages&quot;:[9,462,577,601],&quot;events&quot;:[{&quot;period&quot;:&quot;Không nêu rõ trong đoạn&quot;,&quot;event&quot;:&quot;Tất nhiên, sự nhất trí trong Thành ủy là một thuận lợi quyết định mọi sự thành bại Nếu xem đồng chí Trường Chinh là “nhà thiết kế” của thời kỳ đổi mới thì ông Sáu Dân chính là “nhà thi công&quot;,&quot;pages&quot;:[9]},{&quot;period&quo <script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;

  let state = null;

    const probeKey = `${storageKey}:probe`;

    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);

      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }

  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });

    }
    if (data.type === "height") {
      const height = data.height;

        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {

    }

        typeof top === "number" &&
        Number.isFinite(top) &&

      return;
    }

      const rawHref = data.href;
      if (typeof rawHref !== "string") {

      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;

        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";

        anchor.click();
        anchor.remove();

      return;

      const prompt = data.prompt;

        typeof prompt !== "string" ||

    "load",
    () => {

  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
